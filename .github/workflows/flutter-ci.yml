name: Flutter CI

on:
  push:
    branches: [main, chatgpt/mvp-build]
  pull_request:
    branches: [main]

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Create web platform shell
        run: flutter create --platforms=web --no-pub . --org com.mycompany --project-name farmershub_gh
      - name: Verify committed Android configuration
        run: python3 scripts/check_android.py
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android development APK
        uses: actions/upload-artifact@v4
        with:
          name: farmershub-gh-development-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Build web release
        run: flutter build web --release
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: farmershub-gh-web
          path: build/web
